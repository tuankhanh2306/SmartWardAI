name: SmartWard AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 0. DOCS GOVERNANCE CI: Enforce Clean Root & docs/ Hierarchy
  # ============================================================================
  docs-governance:
    name: Documentation Governance Guardrail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Grant Execute Permission to Governance Script
        run: chmod +x scripts/check-docs-governance.sh

      - name: Enforce Clean Root Directory (.md rules)
        run: ./scripts/check-docs-governance.sh

  # ============================================================================
  # 1. BACKEND CI: Java 21, Maven Build & JUnit Adversarial Tests (420 tests)
  # ============================================================================
  backend-ci:
    name: Backend CI (Java 21 / Spring Boot)
    needs: [docs-governance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Run Backend Unit & Adversarial Tests
        working-directory: ./backend
        run: ./mvnw test -B

      - name: Verify Backend Executable JAR Packaging
        working-directory: ./backend
        run: ./mvnw package -DskipTests -B

  # ============================================================================
  # 2. FRONTEND CI: Node 20, Vite 6 TypeScript Build & Acceptance Tests
  # ============================================================================
  frontend-ci:
    name: Frontend CI (React 18 / Vite 6)
    needs: [docs-governance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Full Test Suite (11 Acceptance & Regression Suites)
        working-directory: ./frontend
        env:
          CI_FRONTEND_ONLY: 'true'
        run: npm run test:all

      - name: Compile Production Web Bundle (TypeScript & Vite)
        working-directory: ./frontend
        run: npm run build

  # ============================================================================
  # 3. MOBILE CI: Node 20, Expo SDK 52 TypeScript & Vitest Test Suite
  # ============================================================================
  mobile-ci:
    name: Mobile CI (React Native / Expo SDK 52)
    needs: [docs-governance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Mobile TypeScript Verification
        working-directory: ./mobile
        run: npm run typecheck

      - name: Run Mobile Vitest Suite (73 Unit & Adversarial Tests)
        working-directory: ./mobile
        run: npm test

  # ============================================================================
  # 4. DOCKER COMPOSE CONFIG & RESOURCE BUDGET VALIDATION (<= 2048 MiB RAM)
  # ============================================================================
  docker-compose-check:
    name: Docker Compose & Resource Limits Validation
    needs: [docs-governance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Environment Template with CI Secrets
        run: |
          cp .env.example .env
          sed -i 's/^VAULT_ENCRYPTION_KEY=.*/VAULT_ENCRYPTION_KEY=sw_vlt_3a7e9c1f5b8d2a6e0c4f7b9e1d3a5c7f_ci_2026/' .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=sw_sec_8f9b4c2e1a7d6e3f5b0c9a8d7e6f5a4b_ci_2026/' .env

      - name: Validate Docker Compose Configuration & Nginx Anti-Spoofing
        run: |
          docker compose config
          grep -q 'proxy_set_header X-Forwarded-For \$remote_addr;' frontend/nginx.conf

      - name: Docker Compose Boot & Live Health / Anti-Spoofing Verification
        run: |
          docker compose up -d --build postgres redis minio ai-sidecar backend frontend
          trap 'docker compose logs --tail=80 backend frontend || true; docker compose down -v' EXIT
          for i in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"UP"'; then
              echo "Backend healthcheck PASSED!"
              break
            fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"UP"'
          curl -fsS -H 'X-Forwarded-For: 203.0.113.99' http://127.0.0.1:3000/api/v1/health | grep -q '"UP"'
          HTTP_GET_TRACK=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/api/v1/dossiers/track?dossierCode=TEST')
          echo "GET /api/v1/dossiers/track HTTP status=$HTTP_GET_TRACK"
          [ "$HTTP_GET_TRACK" != "200" ]

  # ============================================================================
  # 5. CONTINUOUS DEPLOYMENT (CD): Automated Server Deployment via SSH
  # Triggered only when commits land on 'main' and all CI jobs pass.
  # ============================================================================
  deploy:
    name: Continuous Deployment (Production VPS / Server)
    needs: [backend-ci, frontend-ci, mobile-ci, docker-compose-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Credentials
        id: check_credentials
        run: |
          if [ -z "${{ secrets.PROD_SERVER_IP }}" ] || [ -z "${{ secrets.PROD_SERVER_USER }}" ]; then
            echo "::warning ::Production server secrets not configured. Skipping automated remote deployment."
            echo "has_credentials=false" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Remote Production Host
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          script: |
            set -e
            echo "🚀 [Deploy] Triggering production deployment script on $(hostname)..."
            cd /opt/smartward-ai || cd ~/smartward-ai
            bash deploy.sh
            echo "✅ [Deploy] Production stack successfully refreshed under 2048 MiB RAM budget."
