name: SmartWard AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 0. DOCS GOVERNANCE CI: Enforce Clean Root & docs/ Hierarchy
  # ============================================================================
  docs-governance:
    name: Documentation Governance Guardrail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Grant Execute Permission to Governance Script
        run: chmod +x scripts/check-docs-governance.sh

      - name: Enforce Clean Root Directory (.md rules)
        run: ./scripts/check-docs-governance.sh

  # ============================================================================
  # 1. BACKEND CI: Java 21, Maven Build & JUnit Adversarial Tests (420 tests)
  # ============================================================================
  backend-ci:
    name: Backend CI (Java 21 / Spring Boot)
    needs: [docs-governance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x backend/mvnw

      - name: Run Backend Unit & Adversarial Tests
        working-directory: ./backend
        run: ./mvnw test -B

      - name: Verify Backend Executable JAR Packaging
        working-directory: ./backend
        run: ./mvnw package -DskipTests -B

  # ============================================================================
  # 2. FRONTEND CI: Node 20, Vite 6 TypeScript Build & Acceptance Tests
  # ============================================================================
  frontend-ci:
    name: Frontend CI (React 18 / Vite 6)
    needs: [docs-governance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Chatbox Acceptance Tests
        working-directory: ./frontend
        run: npm test

      - name: Compile Production Web Bundle (TypeScript & Vite)
        working-directory: ./frontend
        run: npm run build

  # ============================================================================
  # 3. DOCKER COMPOSE CONFIG & RESOURCE BUDGET VALIDATION (<= 2048 MiB RAM)
  # ============================================================================
  docker-compose-check:
    name: Docker Compose & Resource Limits Validation
    needs: [docs-governance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Environment Template
        run: cp .env.example .env

      - name: Validate Docker Compose Configuration & Service Graph
        run: docker compose config

  # ============================================================================
  # 4. CONTINUOUS DEPLOYMENT (CD): Automated Server Deployment via SSH
  # Triggered only when commits land on 'main' and all CI jobs pass.
  # ============================================================================
  deploy:
    name: Continuous Deployment (Production VPS / Server)
    needs: [backend-ci, frontend-ci, docker-compose-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Credentials
        id: check_credentials
        run: |
          if [ -z "${{ secrets.PROD_SERVER_IP }}" ] || [ -z "${{ secrets.PROD_SERVER_USER }}" ]; then
            echo "::warning ::Production server secrets not configured. Skipping automated remote deployment."
            echo "has_credentials=false" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Remote Production Host
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          script: |
            set -e
            echo "🚀 [Deploy] Triggering production deployment script on $(hostname)..."
            cd /opt/smartward-ai || cd ~/smartward-ai
            bash deploy.sh
            echo "✅ [Deploy] Production stack successfully refreshed under 2048 MiB RAM budget."
