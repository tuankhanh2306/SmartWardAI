# ==============================================================================
# SMARTWARD AI — DOCKER COMPOSE RESOURCE BUDGET (<= 2048 MiB / 2.0 GiB RAM)
#   1. postgres:    448 MiB
#   2. redis:       128 MiB
#   3. minio:       256 MiB
#   4. ai-sidecar:  384 MiB
#   5. backend:     768 MiB
#   6. frontend:     64 MiB
#   -----------------------
#   TOTAL ACTIVE:  2048 MiB (Exactly 2.0 GiB)
#   (minio-init is a one-shot setup job that exits after ~3s)
# ==============================================================================

services:
  # =====================================================================
  # 1. PostgreSQL 16 with pgvector extension
  # Resource Limit: 448MB RAM
  # =====================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartward-postgres
    restart: unless-stopped
    mem_limit: 448m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartward_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (cp .env.example .env)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartward} -d ${POSTGRES_DB:-smartward_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 2. Redis 7 Alpine
  # Resource Limit: 128MB RAM (maxmemory 100mb, volatile-lru policy)
  # =====================================================================
  redis:
    image: redis:7-alpine
    container_name: smartward-redis
    restart: unless-stopped
    mem_limit: 128m
    command: redis-server --maxmemory 100mb --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 3. MinIO S3-Compatible Object Storage
  # Resource Limit: 256MB RAM
  # =====================================================================
  minio:
    image: minio/minio:latest
    container_name: smartward-minio
    restart: unless-stopped
    mem_limit: 256m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env (cp .env.example .env)}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 4. Local AI Sidecar Microservice (FastAPI + PhoBERT INT8)
  # Resource Limit: 384MB RAM
  # =====================================================================
  ai-sidecar:
    build:
      context: .
      dockerfile: ml/sidecar/Dockerfile
    container_name: smartward-ai-sidecar
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # =====================================================================
  # 6. Spring Boot 3.3 Backend API
  # Resource Limit: 768MB RAM (JVM Heap Xmx: 512MB)
  # =====================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartward-backend
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-smartward_db}
      DB_USER: ${POSTGRES_USER:-smartward}
      DB_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-smartward-vault}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:?Set 32-byte VAULT_ENCRYPTION_KEY in .env}
      VAULT_FAIL_CLOSED: ${VAULT_FAIL_CLOSED:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RAG_DEFAULT_THRESHOLD: ${RAG_DEFAULT_THRESHOLD:-0.78}
      RAG_THETA_LOWER: ${RAG_THETA_LOWER:-0.42}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock-offline-mode}
      SIDECAR_URL: http://ai-sidecar:8000
      SIDECAR_ENABLED: "true"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-sidecar:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 7. React 18 + Vite Frontend PWA (Nginx Alpine)
  # Resource Limit: 64MB RAM (Static bundle + Reverse Proxy)
  # =====================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartward-frontend
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
