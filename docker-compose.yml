version: '3.8'

services:
  # =====================================================================
  # 1. PostgreSQL 16 with pgvector extension
  # Resource Limit: 512MB RAM
  # =====================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartward-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: smartward_db
      POSTGRES_USER: smartward
      POSTGRES_PASSWORD: smartward_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartward -d smartward_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 2. Redis 7 Alpine
  # Resource Limit: 128MB RAM (maxmemory 100mb, volatile-lru policy)
  # =====================================================================
  redis:
    image: redis:7-alpine
    container_name: smartward-redis
    restart: unless-stopped
    mem_limit: 128m
    command: redis-server --maxmemory 100mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 3. MinIO S3-Compatible Object Storage
  # Resource Limit: 256MB RAM
  # =====================================================================
  minio:
    image: minio/minio:latest
    container_name: smartward-minio
    restart: unless-stopped
    mem_limit: 256m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 4. MinIO Bucket Initialization & Auto-Lifecycle (mc)
  # Sets hard bucket quota: 5GB, Auto-expiry lifecycle: 7 days
  # =====================================================================
  minio-init:
    image: minio/mc:latest
    container_name: smartward-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 minio_admin minio_secret_key;
      /usr/bin/mc mb myminio/smartward-vault --ignore-existing;
      /usr/bin/mc anonymous set none myminio/smartward-vault;
      /usr/bin/mc quota set myminio/smartward-vault --size 5GB;
      /usr/bin/mc ilm rule add myminio/smartward-vault --expire-days 7;
      echo 'MinIO bucket smartward-vault successfully initialized with 5GB quota and 7-day ILM lifecycle.';
      exit 0;
      "

  # =====================================================================
  # 5. Local AI Sidecar Microservice (FastAPI + PhoBERT INT8)
  # Resource Limit: 384MB RAM
  # =====================================================================
  ai-sidecar:
    build:
      context: .
      dockerfile: ml/sidecar/Dockerfile
    container_name: smartward-ai-sidecar
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # =====================================================================
  # 6. Spring Boot 3.3 Backend API
  # Resource Limit: 768MB RAM (JVM Heap Xmx: 512MB)
  # =====================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartward-backend
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: smartward
      DB_PASS: smartward_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_secret_key
      GEMINI_API_KEY: mock-offline-mode
      SIDECAR_URL: http://ai-sidecar:8000
      SIDECAR_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-sidecar:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # =====================================================================
  # 7. React 18 + Vite Frontend PWA (Nginx Alpine)
  # Resource Limit: 64MB RAM (Static bundle + Reverse Proxy)
  # =====================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartward-frontend
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
