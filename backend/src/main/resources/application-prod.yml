server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartward_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:smartward}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:smartward_secret}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      pool-name: SmartWardProdHikariCP
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:minio_admin}}
  secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:minio_secret_key}}
  bucket: ${MINIO_BUCKET_NAME:smartward-vault}

smartward:
  vault:
    encryption-key: ${VAULT_ENCRYPTION_KEY}
    fail-closed: ${VAULT_FAIL_CLOSED:true}
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl-hours: ${OFFICER_TOKEN_TTL_HOURS:8}
    enforce-officer-auth: ${ENFORCE_OFFICER_AUTH:true}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:30}

logging:
  level:
    root: INFO
    vn.edu.uth.smartward: INFO
