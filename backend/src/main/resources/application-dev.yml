server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/smartward_db
    username: ${DB_USER:smartward}
    password: ${DB_PASS:smartward_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      pool-name: SmartWardHikariCP
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

# MinIO Client Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minio_admin}
  secret-key: ${MINIO_SECRET_KEY:minio_secret_key}
  bucket: smartward-vault

smartward:
  vault:
    encryption-key: ${VAULT_ENCRYPTION_KEY:SmartWardAI_DevTest_VaultKey_32B}
    fail-closed: ${VAULT_FAIL_CLOSED:true}
  security:
    jwt-secret: ${JWT_SECRET:SmartWardAI_DevTest_JwtSecret_32B!}
    token-ttl-hours: ${OFFICER_TOKEN_TTL_HOURS:8}
    enforce-officer-auth: ${ENFORCE_OFFICER_AUTH:true}

logging:
  level:
    root: INFO
    vn.edu.uth.smartward: DEBUG
