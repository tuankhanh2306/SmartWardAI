spring:
  application:
    name: smartward-backend
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

# OpenAPI Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Application specific settings
smartward:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:mock-key-for-local-testing}
      model: ${GEMINI_MODEL:gemini-3-flash-preview}
      embedding-model: text-embedding-004
      embedding-dim: 768
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:8192}
      timeout-seconds: 25
      thinking-budget: ${GEMINI_THINKING_BUDGET:0}
    rag:
      default-threshold: 0.50
      theta-lower: 0.42
      top-k: 3
    sidecar:
      enabled: ${SIDECAR_ENABLED:true}
      url: ${SIDECAR_URL:http://localhost:8000}
      timeout-ms: ${SIDECAR_TIMEOUT_MS:2000}
    triage:
      default-radius-meters: 75.0
      default-similarity-threshold: 0.82
      active-window-hours: 72
  vault:
    bucket-name: smartward-vault
    token-ttl-hours: 24
    watermark-text: "CHỈ DÙNG ĐỂ SƠ DUYỆT HỒ SƠ TẠI UBND"
  rate-limit:
    requests-per-minute: 5
